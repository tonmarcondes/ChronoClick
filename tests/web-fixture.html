<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Cadastro de cliente</title>
<style>body{font:18px system-ui;max-width:900px;margin:60px auto;color:#172033}button,a,input,select{font:inherit;margin:10px;padding:10px 14px}.card{border:1px solid #ccd5e2;border-radius:14px;padding:24px}.notice{background:#e8f7ef;padding:14px;border-radius:8px}</style></head>
<body><h1>Cadastro de cliente</h1><div class="card">
  <p class="notice" id="notice">O cadastro deve ser revisado antes de salvar.</p>
  <label>Nome <input id="name" placeholder="Nome completo"></label>
  <label>Estado <select id="state"><option>São Paulo</option><option>Rio de Janeiro</option></select></label>
  <button id="save">Salvar cliente</button>
  <a href="web-destination.html" id="details">Ver detalhes</a>
  <div id="plain">Área sem ação</div>
</div><script>document.querySelector('#save').addEventListener('click',()=>document.body.dataset.saved='true')</script></body></html>
